name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Check native plugin structure
        run: npm run check:native

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify packed ESM package
        run: npm run verify:pack
